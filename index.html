<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #3182ce;
    font-family: Arial, sans-serif;
  }

  #app-frame {
    position: fixed;
    top: env(safe-area-inset-top, 0);
    left: env(safe-area-inset-left, 0);
    right: env(safe-area-inset-right, 0);
    bottom: env(safe-area-inset-bottom, 0);
    width: 100vw;
    height: 100vh;
    border: none;
    background: #ffffff;
  }

  #loading-screen {
    position: fixed;
    inset: 0;
    background: #3182ce;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    z-index: 10;
    transition: opacity .35s ease;
  }

  #loading-screen img {
    width: 96px;
    height: 96px;
    margin-bottom: 18px;
    border-radius: 22px;
  }

  #loading-screen .spinner {
    width: 34px;
    height: 34px;
    border: 4px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #fallback-link {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    text-decoration: none;
    display: none;
    z-index: 20;
  }

  #fallback-link.show {
    display: block;
  }
</style>
</head>
<body>

  <div id="loading-screen">
    <img src="./icon-192.png" alt="طباعة استيكرات">
    <div class="spinner"></div>
  </div>

  <iframe id="app-frame" allow="clipboard-read; clipboard-write" title="طباعة استيكرات"></iframe>

  <a id="fallback-link" href="#" target="_blank" rel="noopener noreferrer nofollow">فتح التطبيق في المتصفح</a>
